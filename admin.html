<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Шаштараз — әкімші</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,700;1,700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="pole" aria-hidden="true"></div>
    <h1>Жазылғандар <em>тізімі</em></h1>
    <div class="meta"><span id="who">Кірмегенсіз</span></div>
  </header>

  <div id="login" class="sheet">
    <p class="note">Тізімді көру үшін әкімшінің Google аккаунтымен кіріңіз.</p>
    <div class="actions"><button class="btn" id="btnIn" type="button">Google арқылы кіру</button></div>
    <div id="loginMsg"></div>
  </div>

  <div id="panel" hidden>
    <section aria-labelledby="dtitle">
      <span class="label" id="dtitle">Күн</span>
      <div class="days" id="days"></div>
    </section>
    <section aria-labelledby="ttitle" style="margin-top:24px">
      <div class="head-row"><h2 id="ttitle">Броньдар</h2><span class="note" id="count"></span></div>
      <div class="tablebox"><table>
        <thead><tr><th>Уақыт</th><th>Аты</th><th>Телефон</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
    </section>
    <div class="actions" style="margin-top:24px"><a class="btn ghost" href="index.html">Клиент беті</a><button class="btn ghost" id="btnOut" type="button">Шығу</button></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, where, onSnapshot, doc, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { firebaseConfig, ADMIN_EMAIL } from "./config.js";
import { dayKey, dayList, dayTitle, WD, waDigits, el } from "./util.js";

const $ = id => document.getElementById(id);
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const dates = dayList();
let sel = dayKey(dates[0]), unsub = null, rows = [];

$("btnIn").onclick = async () => {
  $("loginMsg").textContent = "";
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (e) { console.error(e); $("loginMsg").append(el("div", { class: "msg err", text: "Кіру сәтсіз: " + (e.code || e.message) })); }
};
$("btnOut").onclick = () => signOut(auth);

onAuthStateChanged(auth, u => {
  const ok = u && !u.isAnonymous && u.email && u.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();
  $("who").textContent = u && !u.isAnonymous ? u.email : "Кірмегенсіз";
  $("login").hidden = !!ok; $("panel").hidden = !ok;
  if (u && !u.isAnonymous && !ok) {
    $("loginMsg").textContent = "";
    $("loginMsg").append(el("div", { class: "msg err", text: u.email + " әкімші емес. Басқа аккаунтпен кіріңіз." }));
  }
  if (ok) { renderDays(); subscribe(); } else if (unsub) { unsub(); unsub = null; }
});

function renderDays() {
  const box = $("days"); box.textContent = "";
  dates.forEach((d, i) => {
    const k = dayKey(d);
    box.append(el("button", {
      class: "day", type: "button", "aria-pressed": String(k === sel),
      onclick: () => { sel = k; renderDays(); subscribe(); }
    },
      el("span", { class: "dw", text: i === 0 ? "Бүгін" : i === 1 ? "Ертең" : WD[d.getUTCDay()] }),
      el("span", { class: "dn", text: String(d.getUTCDate()) }),
      el("span", { class: "df", text: " " })));
  });
  const i = dates.findIndex(x => dayKey(x) === sel);
  $("ttitle").textContent = dayTitle(dates[i], i);
}

function subscribe() {
  if (unsub) unsub();
  $("rows").textContent = ""; $("count").textContent = "Жүктелуде…";
  unsub = onSnapshot(query(collection(db, "bookings"), where("date", "==", sel)), snap => {
    rows = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.time < b.time ? -1 : 1);
    renderRows();
  }, err => { console.error(err); $("count").textContent = "Оқылмады: " + err.code + " (firestore.rules ішіндегі email-ді тексеріңіз)"; });
}

function renderRows() {
  const tb = $("rows"); tb.textContent = "";
  $("count").textContent = rows.length + " бронь";
  if (!rows.length) {
    const td = el("td", { class: "note", text: "Бұл күнге әзірге ешкім жазылмаған." }); td.colSpan = 4;
    tb.append(el("tr", {}, td)); return;
  }
  rows.forEach(r => {
    const wa = el("a", { href: "https://wa.me/" + waDigits(r.phone), target: "_blank", rel: "noopener", text: r.phone });
    tb.append(el("tr", {},
      el("td", { class: "t", text: r.time }),
      el("td", { text: r.name }),
      el("td", { style: "white-space:nowrap" }, wa),
      el("td", {}, el("button", { class: "linkbtn", type: "button", text: "Өшіру", onclick: e => remove(r, e.target) }))));
  });
}

async function remove(r, btn) {
  if (btn.dataset.armed !== "1") { btn.dataset.armed = "1"; btn.textContent = "Растау?"; setTimeout(() => { btn.dataset.armed = ""; btn.textContent = "Өшіру"; }, 4000); return; }
  btn.disabled = true;
  try {
    const b = writeBatch(db);
    b.delete(doc(db, "bookings", r.id));
    b.delete(doc(db, "slots", r.id));
    await b.commit();
  } catch (e) { console.error(e); btn.disabled = false; btn.textContent = "Қате, қайта басыңыз"; }
}
</script>
</body>
</html>
