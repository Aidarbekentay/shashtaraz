<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Шаштараз — әкімші</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,700;1,700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Cg fill=%27none%27 stroke=%27%231f4e79%27 stroke-width=%275%27 stroke-linecap=%27round%27%3E%3Ccircle cx=%2716%27 cy=%2746%27 r=%279%27/%3E%3Ccircle cx=%2748%27 cy=%2746%27 r=%279%27/%3E%3Cpath d=%27M22 39 L46 6M42 39 L18 6%27/%3E%3C/g%3E%3Ccircle cx=%2732%27 cy=%2725%27 r=%273.5%27 fill=%27%23b5832f%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"><circle cx="16" cy="46" r="9"/><circle cx="48" cy="46" r="9"/><path d="M22 39 L46 6"/><path d="M42 39 L18 6"/></g><circle cx="32" cy="25" r="3" fill="var(--brass)"/></svg><div class="pole" aria-hidden="true"></div></div>
    <h1>Жазылғандар <em>тізімі</em></h1>
    <div class="meta"><span>Бүгінгі және алдағы күндердегі броньдар</span></div>
  </header>


  <div id="panel">
    <section aria-labelledby="dtitle">
      <span class="label" id="dtitle">Күн</span>
      <div class="days" id="days"></div>
    </section>
    <section aria-labelledby="ttitle" style="margin-top:24px">
      <div class="head-row"><h2 id="ttitle">Броньдар</h2><span class="note" id="count"></span></div>
      <div class="tablebox"><table>
        <thead><tr><th>Уақыт</th><th>Аты</th><th>Телефон</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
    </section>
    <div class="actions" style="margin-top:24px"><a class="btn ghost" href="index.html">Клиент беті</a></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, where, onSnapshot, doc, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { firebaseConfig } from "./config.js";
import { dayKey, dayList, dayTitle, WD, waDigits, el } from "./util.js";

const $ = id => document.getElementById(id);
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const dates = dayList();
let sel = dayKey(dates[0]), unsub = null, rows = [];

onAuthStateChanged(auth, u => { if (u && !unsub) { renderDays(); subscribe(); } });
signInAnonymously(auth).catch(e => { console.error(e); $("count").textContent = "Қосыла алмадық: " + (e.code || e.message); });
renderDays();

function renderDays() {
  const box = $("days"); box.textContent = "";
  dates.forEach((d, i) => {
    const k = dayKey(d);
    box.append(el("button", {
      class: "day", type: "button", "aria-pressed": String(k === sel),
      onclick: () => { sel = k; renderDays(); subscribe(); }
    },
      el("span", { class: "dw", text: i === 0 ? "Бүгін" : i === 1 ? "Ертең" : WD[d.getUTCDay()] }),
      el("span", { class: "dn", text: String(d.getUTCDate()) }),
      el("span", { class: "df", text: " " })));
  });
  const i = dates.findIndex(x => dayKey(x) === sel);
  $("ttitle").textContent = dayTitle(dates[i], i);
}

function subscribe() {
  if (unsub) unsub();
  $("rows").textContent = ""; $("count").textContent = "Жүктелуде…";
  unsub = onSnapshot(query(collection(db, "bookings"), where("date", "==", sel)), snap => {
    rows = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.time < b.time ? -1 : 1);
    renderRows();
  }, err => { console.error(err); $("count").textContent = "Оқылмады: " + err.code; });
}

function renderRows() {
  const tb = $("rows"); tb.textContent = "";
  $("count").textContent = rows.length + " бронь";
  if (!rows.length) {
    const td = el("td", { class: "note", text: "Бұл күнге әзірге ешкім жазылмаған." }); td.colSpan = 4;
    tb.append(el("tr", {}, td)); return;
  }
  rows.forEach(r => {
    const wa = el("a", { href: "https://wa.me/" + waDigits(r.phone), target: "_blank", rel: "noopener", text: r.phone });
    tb.append(el("tr", {},
      el("td", { class: "t", text: r.time }),
      el("td", { text: r.name }),
      el("td", { style: "white-space:nowrap" }, wa),
      el("td", {}, el("button", { class: "linkbtn", type: "button", text: "Өшіру", onclick: e => remove(r, e.target) }))));
  });
}

async function remove(r, btn) {
  if (btn.dataset.armed !== "1") { btn.dataset.armed = "1"; btn.textContent = "Растау?"; setTimeout(() => { btn.dataset.armed = ""; btn.textContent = "Өшіру"; }, 4000); return; }
  btn.disabled = true;
  try {
    const b = writeBatch(db);
    b.delete(doc(db, "bookings", r.id));
    b.delete(doc(db, "slots", r.id));
    await b.commit();
  } catch (e) { console.error(e); btn.disabled = false; btn.textContent = "Қате, қайта басыңыз"; }
}
</script>
</body>
</html>
